[project]
name = "everyday-tasks-tracker"
version = "0.1.0"
description = "Simple local everyday task tracker"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
everyday-tasks-tracker = "everyday_tasks_tracker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["everyday_tasks_tracker"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.black]
line-length = 120
target-version = ["py314"]

[dependency-groups]
dev = [
    "black>=25.1",
    "ruff>=0.8",
]
